name: cartsignal

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [fulfill]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cartsignal
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan storefronts
        env:
          CARTSIGNAL_BASE_URL: ${{ vars.CARTSIGNAL_BASE_URL }}
          CARTSIGNAL_OWNER_EMAIL: ${{ secrets.CARTSIGNAL_OWNER_EMAIL }}
          CARTSIGNAL_FROM: ${{ vars.CARTSIGNAL_FROM }}
          CARTSIGNAL_BRAND: ${{ vars.CARTSIGNAL_BRAND }}
        run: node src/cli.js scan --concurrency 4

      - name: Send weekly digest
        env:
          CARTSIGNAL_BASE_URL: ${{ vars.CARTSIGNAL_BASE_URL }}
          CARTSIGNAL_OWNER_EMAIL: ${{ secrets.CARTSIGNAL_OWNER_EMAIL }}
          CARTSIGNAL_FROM: ${{ vars.CARTSIGNAL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node src/cli.js digest --send

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "cartsignal-bot"
          git config user.email "cartsignal-bot@users.noreply.github.com"
          git add out
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "scan $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  fulfill:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and email fix pack
        env:
          PACK_DOMAIN: ${{ github.event.client_payload.domain }}
          PACK_EMAIL: ${{ github.event.client_payload.email }}
          CARTSIGNAL_BASE_URL: ${{ vars.CARTSIGNAL_BASE_URL }}
          CARTSIGNAL_FROM: ${{ vars.CARTSIGNAL_FROM }}
          CARTSIGNAL_BRAND: ${{ vars.CARTSIGNAL_BRAND }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node src/cli.js fulfill --domain "$PACK_DOMAIN" --email "$PACK_EMAIL"
